[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    "RUSTSEC-2024-0384",
    "RUSTSEC-2024-0436",
    "RUSTSEC-2025-0057",
    "RUSTSEC-2026-0176",
    "RUSTSEC-2026-0177",
    # webpki-roots 0.26.11 (required by tonic 0.13) only re-exports webpki-roots
    # 1.x, which `[bans]` below keeps at the patched >= 1.0.10.
    "RUSTSEC-2026-0381",
]

[licenses]
version = 2
allow = [
    "Apache-2.0 WITH LLVM-exception",
    "Apache-2.0",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "Unicode-3.0",
    "Zlib"
]

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 }
]

[bans]
multiple-versions = "allow"
wildcards = "warn"
highlight = "all"
# RUSTSEC-2026-0381 is ignored for the 0.26 shim; the roots it re-exports must be patched.
deny = [{ crate = "webpki-roots@~1.0, <1.0.10", reason = "RUSTSEC-2026-0381" }]

[sources]
unknown-git = "deny"
allow-git = []
