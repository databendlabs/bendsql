services:
  minio:
    # Official MinIO registries no longer allow anonymous pulls. Pin the
    # Chainguard image by digest to keep integration tests reproducible.
    image: cgr.dev/chainguard/minio@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1
    # The image defaults to a non-root user that cannot write to ./data.
    user: "0:0"
    command: server /data
    ports:
      - "9000:9000"
    volumes:
      - ./data:/data
  meta:
    image: docker.io/datafuselabs/databend-meta:${DATABEND_META_VERSION:-nightly}
    volumes:
      - ./config/databend-meta-node-1.toml:/conf.toml:ro
    command: -c /conf.toml
    ports:
      - "28101:28101"
    healthcheck:
      test: "databend-metactl status || exit 1"
      interval: 2s
      retries: 10
      start_period: 2s
      timeout: 1s
  query:
    image: docker.io/datafuselabs/databend-query:${DATABEND_QUERY_VERSION:-nightly}
    volumes:
      - ./config/databend-query-node-1.toml:/conf.toml:ro
    command: -c /conf.toml
    environment:
      - QUERY_DATABEND_ENTERPRISE_LICENSE
    ports:
      - "8900-8902:8900" # flight sql handler
      # - "8001-8003:8000" # http handler
    depends_on:
      minio:
        condition: service_started
      meta:
        condition: service_healthy
    healthcheck:
      test: "curl -f localhost:8080/v1/health || exit 1"
      interval: 2s
      retries: 10
      start_period: 2s
      timeout: 1s
  lb:
    image: docker.io/nginx
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8000:8000"
    depends_on:
      query:
        condition: service_healthy
